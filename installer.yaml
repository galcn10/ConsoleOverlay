      - Fixed: with the menu open, Alt+Tab to another window now works; the menu and its dark curtain no longer stay on top of it.
      - Fixed: the same achievement could appear twice (once per language) in the list.
  - Version: 1.3.4
    RequiredApiVersion: 6.15.0
    ReleaseDate: 2026-11-10
    PackageUrl: https://github.com/galcn10/ConsoleOverlay/releases/download/v1.3.4/ConsoleOverlay_galcn10_1_3_4.pext
    Changelog:
      - New optional integration with Console Update Center (only if it is installed): a "Downloads" row in the menu shows the download in progress and pending updates, and opens its panel; closing the panel returns to the overlay menu.
      - Updates finished while you play are shown in the menu as "Update completed".
      - The overlay ignores the controller while the Console Update Center panel is open, and with it installed the Guide button over a game cover is left to it.
