    Changelog:
      - New menu design with colored icons, descriptions and a curved accent bar; lighter on the GPU.
      - Clips play inside the gallery with the optional mpv player (progress bar, durations, no-audio indicator).
      - Achievements without duplicates, unlocked first, filters, rarity highlight and locked ones in grayscale.
      - Faster menu opening; fixes for first-open sound burst and Playnite not responding after repeated calls.
