AddonId: ConsoleOverlay_galcn10
Packages:
  - Version: 1.3.6
    RequiredApiVersion: 6.15.0
    ReleaseDate: 2026-11-13
    PackageUrl: https://github.com/galcn10/ConsoleOverlay/releases/download/v1.3.6/ConsoleOverlay_1_3_6.pext
    Changelog:
      - Fixed: closing the game with the window's X while the menu was open did nothing, because the game is paused. Switching (Alt+Tab) to the game's own window now resumes it and closes the menu.
      - The "Close the game: Start + LB (hold 1.5 s)" shortcut now also works with the menu open. It closes the game without confirmation and without the menu flickering, and LB no longer skips a music track while you hold it.
      - Fixed: after closing the game from a paused state, the "could not bring the game to the front" notice no longer appears when the game is simply closing.
      - New setting "Remember the last menu position" (off by default): the cursor opens on the row where you left it, however you closed the menu (A, B or the Guide button). It resets when a new game starts.
      - Fixed: when a clip is opened in the system video player (no mpv installed), the menu no longer stays on top of it. The menu hides, the player comes to the front, and when you close it (or press Guide) the menu returns to the gallery.
      - Renamed "Start/stop recording" to "Record video": Xbox Game Bar stops recording when the game is paused, so the second press started a new recording instead of stopping it.
      - New notice when the Game Bar does not save a clip within 10 seconds ("Record what happened" is probably off), or when the game runs as administrator and the shortcut keys cannot reach it.
      - Fixed: several settings texts (Menu animations, Menu sounds, Sound volume, Controller vibration, Start + LB) were shown in Spanish in every language. They are now translated in all 15 languages.
      - Extra diagnostic logging for the "Go to Playnite" action (state of the Playnite window).
