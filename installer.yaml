    PackageUrl: https://github.com/galcn10/ConsoleOverlay/releases/download/v1.3.0/ConsoleOverlay_galcn10_1_3_0.pext
    Changelog:
      - Settings redesigned with tabs, switches with help text and a search box.
      - New "Switch to" panel - with "End game" selected, pick one of your last 3 games; the current game closes and the new one opens behind a transition screen.
      - Music card with shuffle, repeat, volume and the player's own colour and icon; "Open music" launches your player when nothing is playing; configurable list of players.
      - Achievements - trophy by rarity on each row, trophy counters, progress bars, gold highlight for unlocked and a platinum trophy on the main menu when you have them all.
      - New options - pause the game when the menu opens, NoPause / NoOverlay tags, skip emulator games, numbered controller batteries and a glass look.
      - Faster menu, fixes when closing a music player and when returning to the game; all 9 languages updated.
