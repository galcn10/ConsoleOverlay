    Changelog:
      - Desktop mode: Playnite stays minimized to the system tray / taskbar after closing a game or using the overlay, instead of popping up in the taskbar.
  - Version: 1.3.2
    RequiredApiVersion: 6.15.0
    ReleaseDate: 2026-10-30
    PackageUrl: https://github.com/galcn10/ConsoleOverlay/releases/download/v1.3.2/ConsoleOverlay_galcn10_1_3_2.pext
    Changelog:
      - Returning to a game that shows "Not responding" is retried for up to 3 seconds.
      - Uncaught background errors are now logged (safety net).
      - New optional diagnostic mode that logs menu, gallery and return-to-game timings.
      - Fixed: captures of other games in the same series no longer appear in the gallery.
      - Shutdown / restart from the menu shows a stable dark screen until the computer turns off.
      - "End game" shows a clean "Closing <game>…" screen instead of the frozen last frame.
      - Fixed: the button used to close the menu (e.g. B) no longer reaches the game on resume.
      - Notification when a requested screenshot is not detected.
      - New "Hidden players" option to remove music players from "Open music".
  - Version: 1.3.1
    RequiredApiVersion: 6.15.0
    ReleaseDate: 2026-10-27
    PackageUrl: https://github.com/galcn10/ConsoleOverlay/releases/download/v1.3.1/ConsoleOverlay_galcn10_1_3_1.pext
    Changelog:
      - Steam games - achievements and progress counters are completed from Steam's local stats files, so they update as soon as the game reports them.
      - Achievement names and descriptions use Steam's translation for the plugin's language.
      - Achievements are re-read whenever the data changes.
      - Six new languages (beta, unreviewed): Polish, Turkish, Korean, Dutch, Ukrainian and Traditional Chinese.
  - Version: 1.3.0
    RequiredApiVersion: 6.15.0
    ReleaseDate: 2026-10-24
    PackageUrl: https://github.com/galcn10/ConsoleOverlay/releases/download/v1.3.0/ConsoleOverlay_galcn10_1_3_0.pext
    Changelog:
      - Settings redesigned with tabs, switches with help text and a search box.
      - New "Switch to" panel - with "End game" selected, pick one of your last 3 games; the current game closes and the new one opens behind a transition screen.
      - Music card with shuffle, repeat, volume and the player's own colour and icon; "Open music" launches your player when nothing is playing; configurable list of players.
      - Achievements - trophy by rarity on each row, trophy counters, progress bars, gold highlight for unlocked and a platinum trophy on the main menu when you have them all.
